services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nyumbapap
      POSTGRES_PASSWORD: nyumbapap_dev
      POSTGRES_DB: nyumbapap
    ports:
      - "5432:5432"
    volumes:
      - nyumbapap_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyumbapap -d nyumbapap"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nyumbapap_postgres:
